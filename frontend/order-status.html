<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QResto - Order Status</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 7px 0 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .order-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .order-card h2 {
            color: #6b1e1e;
        }

        .items {
            padding-left: 20px;
            line-height: 1.8;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .status-box,
        .payment-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            background: #f6f1e8;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
        }

        .pending {
            color: #d89b00;
        }

        .preparing {
            color: #e67e22;
        }

        .ready {
            color: green;
        }

        .payment-title {
            font-size: 20px;
            font-weight: bold;
        }

        .payment-pending {
            color: #d89b00;
            font-weight: bold;
        }

        .payment-paid {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .payment-button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .payment-button:hover {
            background: #b77d00;
        }

        .error {
            text-align: center;
            color: #6b1e1e;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #666;
            font-weight: bold;
        }

        .server-info {
            margin-top: 15px;
            padding: 10px;
            background: #faf7f1;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <h1>🍽️ QResto</h1>

        <p>Track Your Order</p>

    </header>


    <!-- ==========================================
         CONTAINER
    =========================================== -->

    <div class="container">

        <div id="order-container">

            <p class="loading">
                ⏳ Loading order...
            </p>

        </div>

    </div>


    <script>


        // ==========================================
        // SERVER URL
        // ==========================================

        /*
            LOCAL:
            http://localhost:3000

            RENDER:
            https://smart-restaurant-3axh.onrender.com

            Automatically detects current server.
        */

        const SERVER_URL =
            window.location.origin;


        console.log(
            "🌐 Server URL:",
            SERVER_URL
        );


        // ==========================================
        // GET ORDER ID
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const orderId =
            urlParams.get("order");


        console.log(
            "🧾 Order ID:",
            orderId
        );


        // ==========================================
        // OPEN BILL
        // ==========================================

        function openBill() {

            if (!orderId) {

                alert(
                    "❌ Order ID not found"
                );

                return;

            }


            /*
                Use relative URL.

                This automatically stays
                on the same Render server.
            */

            window.location.href =
                `bill.html?order=${encodeURIComponent(orderId)}`;

        }


        // ==========================================
        // LOAD ORDER
        // ==========================================

        async function loadOrder() {


            // ==========================================
            // CHECK ORDER ID
            // ==========================================

            if (!orderId) {

                document.getElementById(
                    "order-container"
                ).innerHTML = `

                    <p class="error">

                        ❌ Order ID not found

                    </p>

                `;

                return;

            }


            try {


                console.log(
                    "📡 Loading order from:",
                    `${SERVER_URL}/api/orders/${orderId}`
                );


                // ==========================================
                // FETCH ORDER
                // ==========================================

                const response =
                    await fetch(

                        `${SERVER_URL}/api/orders/${encodeURIComponent(orderId)}`,

                        {

                            method: "GET",

                            headers: {

                                "Accept":
                                    "application/json"

                            }

                        }

                    );


                console.log(
                    "📥 Server status:",
                    response.status
                );


                // ==========================================
                // SERVER ERROR
                // ==========================================

                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }


                // ==========================================
                // READ JSON
                // ==========================================

                const data =
                    await response.json();


                console.log(
                    "📦 Order response:",
                    data
                );


                // ==========================================
                // CHECK SUCCESS
                // ==========================================

                if (!data.success) {

                    throw new Error(

                        data.message ||

                        "Order not found"

                    );

                }


                const order =
                    data.order;


                // ==========================================
                // ITEMS
                // ==========================================

                let items = [];


                try {

                    if (
                        typeof order.items ===
                        "string"
                    ) {

                        items =
                            JSON.parse(
                                order.items
                            );

                    }

                    else {

                        items =
                            order.items || [];

                    }

                }

                catch (error) {

                    console.error(
                        "❌ Items JSON error:",
                        error
                    );

                    items = [];

                }


                // ==========================================
                // ITEMS HTML
                // ==========================================

                let itemsHTML = "";


                items.forEach(item => {


                    const quantity =
                        Number(
                            item.quantity
                        ) || 1;


                    const price =
                        Number(
                            item.price
                        ) || 0;


                    const itemTotal =
                        price * quantity;


                    itemsHTML += `

                        <li>

                            ${item.name}

                            × ${quantity}

                            -

                            ₹${itemTotal.toFixed(2)}

                        </li>

                    `;

                });


                if (!itemsHTML) {

                    itemsHTML = `

                        <li>
                            No items found
                        </li>

                    `;

                }


                // ==========================================
                // ORDER STATUS
                // ==========================================

                const orderStatus =
                    order.status || "Pending";


                let statusClass =
                    "pending";


                let statusIcon =
                    "🟡";


                if (
                    orderStatus ===
                    "Preparing"
                ) {

                    statusClass =
                        "preparing";

                    statusIcon =
                        "🟠";

                }


                else if (
                    orderStatus ===
                    "Ready"
                ) {

                    statusClass =
                        "ready";

                    statusIcon =
                        "🟢";

                }


                // ==========================================
                // PAYMENT STATUS
                // ==========================================

                const paymentStatus =
                    order.payment_status ||
                    "Pending";


                let paymentHTML = "";


                if (
                    paymentStatus ===
                    "Paid"
                ) {

                    paymentHTML = `

                        <div class="payment-box">

                            <div class="payment-title">

                                💰 Payment Status

                            </div>

                            <p class="payment-paid">

                                ✅ Payment Received

                            </p>

                            <p>

                                Thank you!
                                Your payment has
                                been confirmed.

                            </p>

                        </div>

                    `;

                }

                else {

                    paymentHTML = `

                        <div class="payment-box">

                            <div class="payment-title">

                                💰 Payment Status

                            </div>

                            <p class="payment-pending">

                                🟡 Payment Pending

                            </p>

                            <p>

                                Please pay at the
                                restaurant counter.

                            </p>

                        </div>

                    `;

                }


                // ==========================================
                // BILL BUTTON
                // ==========================================

                let billButton = "";


                if (
                    orderStatus ===
                    "Ready"
                ) {

                    billButton = `

                        <button
                            class="payment-button"
                            onclick="openBill()"
                        >

                            🧾 View Bill

                        </button>

                    `;

                }


                // ==========================================
                // DISPLAY ORDER
                // ==========================================

                document.getElementById(
                    "order-container"
                ).innerHTML = `

                    <div class="order-card">


                        <h2>

                            🧾 Order #${order.id}

                        </h2>


                        <p>

                            🪑 Table:

                            <strong>

                                ${order.table_number}

                            </strong>

                        </p>


                        <h3>

                            🍛 Your Items

                        </h3>


                        <ul class="items">

                            ${itemsHTML}

                        </ul>


                        <p class="total">

                            💰 Total:

                            ₹${Number(
                                order.total || 0
                            ).toFixed(2)}

                        </p>


                        <div class="status-box">

                            <div
                                class="status ${statusClass}"
                            >

                                ${statusIcon}

                                ${orderStatus}

                            </div>

                        </div>


                        ${paymentHTML}


                        ${billButton}


                    </div>

                `;

            }


            // ==========================================
            // ERROR
            // ==========================================

            catch (error) {


                console.error(
                    "❌ Order status error:",
                    error
                );


                document.getElementById(
                    "order-container"
                ).innerHTML = `

                    <div>

                        <p class="error">

                            ❌ Cannot load order status

                        </p>


                        <div class="server-info">

                            Server:
                            ${SERVER_URL}

                        </div>

                    </div>

                `;

            }

        }


        // ==========================================
        // FIRST LOAD
        // ==========================================

        loadOrder();


        // ==========================================
        // AUTO REFRESH
        // ==========================================

        setInterval(

            loadOrder,

            5000

        );


    </script>


</body>

</html>
