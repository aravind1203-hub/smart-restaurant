<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QResto - Kitchen Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .container > h2 {
            text-align: center;
            color: #6b1e1e;
            margin-bottom: 25px;
        }

        .orders {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .order-card h2 {
            margin-top: 0;
            color: #6b1e1e;
        }

        .order-card ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        .status {
            font-weight: bold;
            margin: 15px 0;
        }

        .pending {
            color: #d89b00;
        }

        .preparing {
            color: #e67e22;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #b77d00;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .no-orders {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 30px;
        }

        .error {
            text-align: center;
            color: #6b1e1e;
            font-weight: bold;
            padding: 30px;
        }

        .refresh-info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>

    <header>

        <h1>👨‍🍳 QResto Kitchen Dashboard</h1>

        <p>Manage Customer Orders</p>

    </header>


    <div class="container">

        <h2>🆕 Kitchen Orders</h2>

        <p class="refresh-info">
            🔄 Automatically refreshes every 5 seconds
        </p>

        <div
            class="orders"
            id="orders">

            <div class="no-orders">
                Loading orders...
            </div>

        </div>

    </div>


    <script>

        // ==================================================
        // LIVE SERVER
        // ==================================================

        // IMPORTANT:
        // Do NOT use localhost here.
        // Empty string means same Render server.

        const SERVER_URL = "";


        // ==================================================
        // LOAD ORDERS
        // ==================================================

        async function loadOrders() {

            const ordersContainer =
                document.getElementById("orders");


            try {

                const response = await fetch(
                    `${SERVER_URL}/api/orders`,
                    {
                        cache: "no-store"
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        `Server error: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "✅ Orders received:",
                    data
                );


                ordersContainer.innerHTML = "";


                // ==================================================
                // NO ORDERS
                // ==================================================

                if (
                    !data.success ||
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders">

                            🍽️ No orders yet

                        </div>

                    `;

                    return;

                }


                // ==================================================
                // ONLY PENDING / PREPARING
                // ==================================================

                const kitchenOrders =
                    data.orders.filter(order =>

                        order.status === "Pending" ||
                        order.status === "Preparing"

                    );


                if (kitchenOrders.length === 0) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders">

                            ✅ No active kitchen orders

                        </div>

                    `;

                    return;

                }


                // ==================================================
                // DISPLAY ORDERS
                // ==================================================

                kitchenOrders.forEach(order => {


                    // ----------------------------------------------
                    // ITEMS
                    // ----------------------------------------------

                    let items = [];


                    try {

                        if (
                            typeof order.items === "string"
                        ) {

                            items =
                                JSON.parse(order.items);

                        }

                        else {

                            items =
                                order.items || [];

                        }

                    }

                    catch (error) {

                        console.error(
                            "❌ Items JSON error:",
                            error
                        );

                        items = [];

                    }


                    // ----------------------------------------------
                    // ITEMS HTML
                    // ----------------------------------------------

                    let itemsHTML = "";


                    items.forEach(item => {

                        itemsHTML += `

                            <li>

                                <strong>
                                    ${item.name}
                                </strong>

                                × ${item.quantity}

                            </li>

                        `;

                    });


                    // ----------------------------------------------
                    // STATUS
                    // ----------------------------------------------

                    const status =
                        order.status || "Pending";


                    let statusClass =
                        "pending";


                    if (
                        status === "Preparing"
                    ) {

                        statusClass =
                            "preparing";

                    }


                    // ----------------------------------------------
                    // BUTTON
                    // ----------------------------------------------

                    let buttonHTML = "";


                    if (
                        status === "Pending"
                    ) {

                        buttonHTML = `

                            <button
                                onclick="startPreparing(${order.id})"
                            >

                                👨‍🍳 Start Preparing

                            </button>

                        `;

                    }


                    else if (
                        status === "Preparing"
                    ) {

                        buttonHTML = `

                            <button
                                onclick="markReady(${order.id})"
                            >

                                ✅ Mark as Ready

                            </button>

                        `;

                    }


                    // ----------------------------------------------
                    // ORDER CARD
                    // ----------------------------------------------

                    ordersContainer.innerHTML += `

                        <div class="order-card">

                            <h2>

                                🧾 Order #${order.id}

                            </h2>


                            <p>

                                🪑 Table:

                                <strong>
                                    ${order.table_number}
                                </strong>

                            </p>


                            <h3>
                                🍛 Items
                            </h3>


                            <ul>

                                ${itemsHTML}

                            </ul>


                            <p>

                                <strong>
                                    💰 Total:
                                    ₹${order.total}
                                </strong>

                            </p>


                            <p
                                class="status ${statusClass}"
                            >

                                Status:
                                ${status}

                            </p>


                            ${buttonHTML}

                        </div>

                    `;

                });

            }


            catch (error) {

                console.error(
                    "❌ Cannot load kitchen orders:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="error">

                        ❌ Cannot connect to restaurant server

                        <br><br>

                        Please check Render server.

                    </div>

                `;

            }

        }


        // ==================================================
        // PENDING → PREPARING
        // ==================================================

        async function startPreparing(orderId) {

            try {

                const response = await fetch(

                    `${SERVER_URL}/api/orders/${orderId}/status`,

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            status: "Preparing"

                        })

                    }

                );


                const data =
                    await response.json();


                console.log(
                    "Status response:",
                    data
                );


                if (data.success) {

                    alert(
                        "👨‍🍳 Order is now Preparing!"
                    );

                    loadOrders();

                }

                else {

                    alert(
                        "❌ " +
                        (
                            data.message ||
                            "Could not update order"
                        )
                    );

                }

            }


            catch (error) {

                console.error(
                    "❌ Preparing error:",
                    error
                );

                alert(
                    "❌ Cannot connect to server!"
                );

            }

        }


        // ==================================================
        // PREPARING → READY
        // ==================================================

        async function markReady(orderId) {

            try {

                const response = await fetch(

                    `${SERVER_URL}/api/orders/${orderId}/status`,

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            status: "Ready"

                        })

                    }

                );


                const data =
                    await response.json();


                console.log(
                    "Ready response:",
                    data
                );


                if (data.success) {

                    alert(
                        "✅ Order is Ready!"
                    );

                    loadOrders();

                }

                else {

                    alert(
                        "❌ " +
                        (
                            data.message ||
                            "Could not update order"
                        )
                    );

                }

            }


            catch (error) {

                console.error(
                    "❌ Ready error:",
                    error
                );

                alert(
                    "❌ Cannot connect to server!"
                );

            }

        }


        // ==================================================
        // FIRST LOAD
        // ==================================================

        loadOrders();


        // ==================================================
        // AUTO REFRESH
        // ==================================================

        setInterval(
            loadOrders,
            5000
        );

    </script>

</body>

</html>
