<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QResto - Cashier Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
            color: #222;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .container > h2 {
            color: #6b1e1e;
            text-align: center;
            margin-bottom: 25px;
        }

        .server-status {
            text-align: center;
            margin-bottom: 25px;
            padding: 12px;
            border-radius: 10px;
            background: white;
            font-weight: bold;
            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .payments {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 25px;
        }

        .payment-card {
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            border-top: 5px solid #d89b00;
        }

        .payment-card h2 {
            margin-top: 0;
            color: #6b1e1e;
        }

        .payment-card p {
            line-height: 1.6;
        }

        .items {
            padding-left: 20px;
            line-height: 1.8;
        }

        .items li {
            margin-bottom: 5px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #6b1e1e;
        }

        .payment-status {
            font-weight: bold;
            margin: 15px 0;
            color: #d89b00;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #b77d00;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #6b1e1e;
            padding: 30px;

            background: white;
            border-radius: 15px;
        }

        .error {
            text-align: center;
            color: #b00000;
            font-weight: bold;
            padding: 30px;
            background: #ffe5e5;
            border-radius: 15px;
        }

        .refresh-info {
            text-align: center;
            color: #777;
            margin-top: 25px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            header {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 25px;
            }

            .payment-card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header>

        <h1>
            💰 QResto Cashier
        </h1>

        <p>
            Payment Dashboard
        </p>

    </header>


    <!-- ==========================================
         MAIN CONTAINER
    ========================================== -->

    <div class="container">


        <h2>
            💵 Pending Payments
        </h2>


        <!-- ==========================================
             SERVER STATUS
        ========================================== -->

        <div
            class="server-status"
            id="server-status"
        >

            🔄 Connecting to server...

        </div>


        <!-- ==========================================
             PAYMENTS
        ========================================== -->

        <div
            class="payments"
            id="payments"
        >

            <p class="empty">

                🔄 Loading payments...

            </p>

        </div>


        <p class="refresh-info">

            🔄 Payments automatically refresh every 5 seconds

        </p>


    </div>


    <script>


        // ==========================================
        // SERVER URL
        // ==========================================

        /*
            IMPORTANT:

            Local:
            http://localhost:3000

            Render:
            https://smart-restaurant-3axh.onrender.com

            Because frontend and backend are hosted
            from the same server, we use:

            window.location.origin
        */

        const SERVER_URL =
            window.location.origin;


        console.log(
            "🌐 SERVER URL:",
            SERVER_URL
        );


        // ==========================================
        // SERVER STATUS
        // ==========================================

        function setServerStatus(
            connected,
            message
        ) {

            const status =
                document.getElementById(
                    "server-status"
                );


            if (!status) {

                return;

            }


            if (connected) {

                status.style.background =
                    "#e5ffe5";

                status.style.color =
                    "#087f23";

                status.textContent =
                    "🟢 Server Connected";

            }

            else {

                status.style.background =
                    "#ffe5e5";

                status.style.color =
                    "#b00000";

                status.textContent =
                    message ||
                    "🔴 Server Connection Failed";

            }

        }


        // ==========================================
        // LOAD PENDING PAYMENTS
        // ==========================================

        async function loadPayments() {

            const container =
                document.getElementById(
                    "payments"
                );


            try {

                console.log(
                    "📡 Loading pending payments..."
                );

                console.log(
                    "📡 API:",
                    `${SERVER_URL}/api/payments/pending`
                );


                const response =
                    await fetch(

                        `${SERVER_URL}/api/payments/pending`,

                        {

                            method: "GET",

                            headers: {

                                "Accept":
                                    "application/json"

                            },

                            cache: "no-store"

                        }

                    );


                console.log(
                    "📥 Response status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "📥 Payment response:",
                    data
                );


                // ==========================================
                // SERVER ERROR
                // ==========================================

                if (!response.ok) {

                    throw new Error(

                        data.message ||
                        `Server error: ${response.status}`

                    );

                }


                // ==========================================
                // CONNECTION SUCCESS
                // ==========================================

                setServerStatus(
                    true
                );


                container.innerHTML =
                    "";


                // ==========================================
                // NO PENDING PAYMENTS
                // ==========================================

                if (
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    container.innerHTML = `

                        <p class="empty">

                            ✅ No pending payments

                        </p>

                    `;

                    return;

                }


                // ==========================================
                // DISPLAY PAYMENTS
                // ==========================================

                data.orders.forEach(
                    order => {


                        // ==========================================
                        // PARSE ITEMS
                        // ==========================================

                        let items = [];


                        try {

                            if (
                                typeof order.items ===
                                "string"
                            ) {

                                items =
                                    JSON.parse(
                                        order.items
                                    );

                            }

                            else {

                                items =
                                    order.items ||
                                    [];

                            }

                        }

                        catch (itemError) {

                            console.error(
                                "❌ Item JSON error:",
                                itemError
                            );

                            items = [];

                        }


                        // ==========================================
                        // ITEMS HTML
                        // ==========================================

                        let itemsHTML = "";


                        items.forEach(
                            item => {


                                const quantity =
                                    Number(
                                        item.quantity
                                    ) || 1;


                                const price =
                                    Number(
                                        item.price
                                    ) || 0;


                                const itemTotal =
                                    price *
                                    quantity;


                                itemsHTML += `

                                    <li>

                                        ${escapeHTML(
                                            item.name
                                        )}

                                        × ${quantity}

                                        -

                                        ₹${itemTotal.toFixed(2)}

                                    </li>

                                `;

                            }
                        );


                        // ==========================================
                        // CARD
                        // ==========================================

                        container.innerHTML += `

                            <div
                                class="payment-card"
                            >

                                <h2>

                                    🧾 Order #${order.id}

                                </h2>


                                <p>

                                    🪑 Table:

                                    <strong>

                                        ${order.table_number}

                                    </strong>

                                </p>


                                <h3>

                                    🍛 Items

                                </h3>


                                <ul
                                    class="items"
                                >

                                    ${
                                        itemsHTML ||
                                        "<li>No items found</li>"
                                    }

                                </ul>


                                <p
                                    class="total"
                                >

                                    💰 Total:

                                    ₹${Number(
                                        order.total
                                    ).toFixed(2)}

                                </p>


                                <p
                                    class="payment-status"
                                >

                                    💵 Payment:

                                    ${
                                        order.payment_status
                                    }

                                </p>


                                <button
                                    onclick="
                                        receivePayment(
                                            ${order.id}
                                        )
                                    "
                                >

                                    💵 Receive Payment

                                </button>

                            </div>

                        `;

                    }
                );

            }


            catch (error) {

                console.error(
                    "❌ Payment loading error:",
                    error
                );


                setServerStatus(
                    false,
                    "🔴 Cannot connect to restaurant server"
                );


                container.innerHTML = `

                    <div class="error">

                        ❌ Cannot connect to server

                        <br><br>

                        Please check the backend server.

                        <br><br>

                        <small>

                            ${error.message}

                        </small>

                    </div>

                `;

            }

        }


        // ==========================================
        // RECEIVE PAYMENT
        // ==========================================

        async function receivePayment(
            orderId
        ) {


            const confirmPayment =
                confirm(

                    `💰 Confirm payment received?\n\n` +

                    `🧾 Order ID: #${orderId}\n\n` +

                    `Click OK after receiving cash.`

                );


            if (!confirmPayment) {

                return;

            }


            try {


                console.log(
                    "💰 Processing payment:",
                    orderId
                );


                const response =
                    await fetch(

                        `${SERVER_URL}/api/payments/${orderId}`,

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            }

                        }

                    );


                console.log(
                    "📥 Payment status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "📥 Payment response:",
                    data
                );


                // ==========================================
                // PAYMENT SUCCESS
                // ==========================================

                if (
                    response.ok &&
                    data.success
                ) {

                    alert(

                        `✅ Payment received successfully!\n\n` +

                        `🧾 Order: #${orderId}\n` +

                        `🪑 Table: ${data.table}\n\n` +

                        `🟢 Table is now Available`

                    );


                    // Reload payment list
                    await loadPayments();


                }

                // ==========================================
                // PAYMENT ERROR
                // ==========================================

                else {

                    alert(

                        "❌ Payment update failed!\n\n" +

                        (
                            data.message ||
                            "Unknown server error"
                        )

                    );

                }

            }


            catch (error) {

                console.error(
                    "❌ Payment error:",
                    error
                );


                alert(

                    "❌ Cannot connect to restaurant server!\n\n" +

                    error.message

                );

            }

        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ==========================================
        // FIRST LOAD
        // ==========================================

        loadPayments();


        // ==========================================
        // AUTO REFRESH
        // ==========================================

        setInterval(

            loadPayments,

            5000

        );


    </script>


</body>

</html>
