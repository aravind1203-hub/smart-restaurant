<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QResto - Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f6f1e8;

        }


        header {

            background: #6b1e1e;

            color: white;

            text-align: center;

            padding: 25px;

        }


        header h1 {

            margin: 0;

        }


        header p {

            margin-bottom: 0;

        }


        .container {

            width: 90%;

            max-width: 1200px;

            margin: 30px auto;

        }


        /* ==========================================
           STATS
        ========================================== */


        .stats {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

            margin-bottom: 35px;

        }


        .stat-card {

            background: white;

            padding: 25px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            transition: 0.2s;

        }


        .stat-card:hover {

            transform: translateY(-3px);

        }


        .stat-card h2 {

            margin: 0;

            font-size: 35px;

            color: #6b1e1e;

        }


        .stat-card p {

            font-weight: bold;

            margin-bottom: 0;

        }


        /* ==========================================
           SECTION TITLE
        ========================================== */


        .section-title {

            color: #6b1e1e;

            text-align: center;

            margin-bottom: 25px;

        }


        /* ==========================================
           ORDERS
        ========================================== */


        .orders {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 25px;

        }


        .order-card {

            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

        }


        .order-card h2 {

            margin-top: 0;

            color: #6b1e1e;

        }


        .order-card ul {

            padding-left: 20px;

            line-height: 1.8;

        }


        .total {

            font-size: 20px;

            font-weight: bold;

        }


        .status {

            font-weight: bold;

        }


        /* ==========================================
           STATUS COLORS
        ========================================== */


        .pending {

            color: #d89b00;

        }


        .preparing {

            color: #e67e22;

        }


        .ready {

            color: green;

        }


        .paid {

            color: green;

        }


        .payment-pending {

            color: #d89b00;

        }


        /* ==========================================
           NO ORDERS / ERROR
        ========================================== */


        .no-orders {

            text-align: center;

            padding: 30px;

            color: #666;

            background: white;

            border-radius: 15px;

        }


        .error-message {

            text-align: center;

            padding: 30px;

            color: #6b1e1e;

            background: white;

            border-radius: 15px;

            font-weight: bold;

        }


        /* ==========================================
           REFRESH INFO
        ========================================== */


        .refresh-info {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 20px;

        }


        .server-status {

            text-align: center;

            font-weight: bold;

            margin-bottom: 25px;

        }


        .server-online {

            color: green;

        }


        .server-offline {

            color: #6b1e1e;

        }


        /* ==========================================
           MOBILE
        ========================================== */


        @media (max-width: 600px) {

            header {

                padding: 20px;

            }


            header h1 {

                font-size: 24px;

            }


            .container {

                width: 94%;

            }


            .stat-card h2 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->


    <header>

        <h1>
            📊 QResto Admin Dashboard
        </h1>

        <p>
            Restaurant Overview
        </p>

    </header>


    <!-- ==========================================
         MAIN CONTAINER
    ========================================== -->


    <div class="container">


        <!-- ======================================
             SERVER STATUS
        ====================================== -->


        <div
            id="server-status"
            class="server-status">

            🔄 Connecting to restaurant server...

        </div>


        <!-- ======================================
             STATISTICS
        ====================================== -->


        <div class="stats">


            <!-- TOTAL ORDERS -->


            <div class="stat-card">

                <h2 id="total-orders">
                    0
                </h2>

                <p>
                    📦 Total Orders
                </p>

            </div>


            <!-- PENDING -->


            <div class="stat-card">

                <h2 id="pending-orders">
                    0
                </h2>

                <p>
                    ⏳ Pending
                </p>

            </div>


            <!-- PREPARING -->


            <div class="stat-card">

                <h2 id="preparing-orders">
                    0
                </h2>

                <p>
                    👨‍🍳 Preparing
                </p>

            </div>


            <!-- READY -->


            <div class="stat-card">

                <h2 id="ready-orders">
                    0
                </h2>

                <p>
                    ✅ Ready
                </p>

            </div>


            <!-- TOTAL SALES -->


            <div class="stat-card">

                <h2 id="total-sales">
                    ₹0
                </h2>

                <p>
                    💰 Total Sales
                </p>

            </div>


        </div>


        <!-- ======================================
             RECENT ORDERS
        ====================================== -->


        <h2 class="section-title">

            🧾 Recent Orders

        </h2>


        <div
            class="refresh-info"
            id="refresh-info">

            🔄 Updating every 5 seconds...

        </div>


        <div
            class="orders"
            id="orders">

        </div>


    </div>



    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->


    <script>


        // ==================================================
        // API URL
        // ==================================================

        /*
            IMPORTANT:

            Do NOT use:

            http://localhost:3000

            Because this page is running on Render.

            Using relative API URL allows both:

            Local:
            http://localhost:3000/api/orders

            Render:
            https://smart-restaurant-3axh.onrender.com/api/orders
        */


        const API_URL = "/api/orders";



        // ==================================================
        // LOAD DASHBOARD
        // ==================================================


        async function loadDashboard() {


            const serverStatus =
                document.getElementById(
                    "server-status"
                );


            try {


                // ==========================================
                // CONNECT TO SERVER
                // ==========================================


                const response =
                    await fetch(API_URL, {

                        method: "GET",

                        cache: "no-store"

                    });


                // ==========================================
                // CHECK RESPONSE
                // ==========================================


                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }


                // ==========================================
                // GET JSON
                // ==========================================


                const data =
                    await response.json();


                // ==========================================
                // CHECK DATA
                // ==========================================


                if (!data.success) {

                    throw new Error(
                        "Invalid server response"
                    );

                }


                const orders =
                    Array.isArray(data.orders)
                        ? data.orders
                        : [];


                // ==========================================
                // SERVER ONLINE
                // ==========================================


                serverStatus.textContent =
                    "🟢 Restaurant Server Connected";


                serverStatus.className =
                    "server-status server-online";


                // ==========================================
                // TOTAL ORDERS
                // ==========================================


                document.getElementById(
                    "total-orders"
                ).textContent =
                    orders.length;


                // ==========================================
                // PENDING ORDERS
                // ==========================================


                const pending =
                    orders.filter(
                        order =>
                            order.status === "Pending"
                    ).length;


                document.getElementById(
                    "pending-orders"
                ).textContent =
                    pending;


                // ==========================================
                // PREPARING ORDERS
                // ==========================================


                const preparing =
                    orders.filter(
                        order =>
                            order.status === "Preparing"
                    ).length;


                document.getElementById(
                    "preparing-orders"
                ).textContent =
                    preparing;


                // ==========================================
                // READY ORDERS
                // ==========================================


                const ready =
                    orders.filter(
                        order =>
                            order.status === "Ready"
                    ).length;


                document.getElementById(
                    "ready-orders"
                ).textContent =
                    ready;


                // ==========================================
                // TOTAL SALES
                // ==========================================


                const totalSales =
                    orders.reduce(

                        (sum, order) => {

                            return sum +
                                Number(
                                    order.total || 0
                                );

                        },

                        0

                    );


                document.getElementById(
                    "total-sales"
                ).textContent =
                    `₹${totalSales}`;


                // ==========================================
                // ORDERS CONTAINER
                // ==========================================


                const ordersContainer =
                    document.getElementById(
                        "orders"
                    );


                ordersContainer.innerHTML = "";


                // ==========================================
                // NO ORDERS
                // ==========================================


                if (orders.length === 0) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders">

                            📋 No orders found

                        </div>

                    `;

                    return;

                }


                // ==========================================
                // LATEST 10 ORDERS
                // ==========================================


                orders
                    .slice(0, 10)
                    .forEach(order => {


                        // ==================================
                        // ITEMS
                        // ==================================


                        let items = [];


                        try {


                            if (
                                typeof order.items ===
                                "string"
                            ) {

                                items =
                                    JSON.parse(
                                        order.items
                                    );

                            }

                            else {

                                items =
                                    order.items || [];

                            }


                            if (
                                !Array.isArray(items)
                            ) {

                                items = [];

                            }

                        }

                        catch (error) {

                            console.error(
                                "❌ Items JSON error:",
                                error
                            );

                            items = [];

                        }


                        // ==================================
                        // ITEMS HTML
                        // ==================================


                        let itemsHTML = "";


                        items.forEach(item => {


                            const quantity =
                                Number(
                                    item.quantity || 0
                                );


                            const price =
                                Number(
                                    item.price || 0
                                );


                            const itemTotal =
                                price * quantity;


                            itemsHTML += `

                                <li>

                                    ${item.name || "Item"}

                                    × ${quantity}

                                    - ₹${itemTotal}

                                </li>

                            `;

                        });


                        // ==================================
                        // STATUS CLASS
                        // ==================================


                        let statusClass = "";


                        if (
                            order.status ===
                            "Pending"
                        ) {

                            statusClass =
                                "pending";

                        }


                        else if (
                            order.status ===
                            "Preparing"
                        ) {

                            statusClass =
                                "preparing";

                        }


                        else if (
                            order.status ===
                            "Ready"
                        ) {

                            statusClass =
                                "ready";

                        }


                        // ==================================
                        // PAYMENT STATUS
                        // ==================================


                        const paymentStatus =
                            order.payment_status ||
                            "Pending";


                        let paymentClass = "";


                        if (
                            paymentStatus ===
                            "Paid"
                        ) {

                            paymentClass =
                                "paid";

                        }

                        else {

                            paymentClass =
                                "payment-pending";

                        }


                        // ==================================
                        // CREATE ORDER CARD
                        // ==================================


                        ordersContainer.innerHTML += `

                            <div class="order-card">


                                <h2>

                                    🧾 Order #${order.id}

                                </h2>


                                <p>

                                    🪑 Table:

                                    <strong>

                                        ${order.table_number}

                                    </strong>

                                </p>


                                <h3>

                                    🍛 Items

                                </h3>


                                <ul>

                                    ${itemsHTML}

                                </ul>


                                <p class="total">

                                    Total:

                                    ₹${order.total}

                                </p>


                                <p class="status">

                                    Status:

                                    <span
                                        class="${statusClass}"
                                    >

                                        ${order.status}

                                    </span>

                                </p>


                                <p class="status">

                                    💰 Payment:

                                    <span
                                        class="${paymentClass}"
                                    >

                                        ${paymentStatus}

                                    </span>

                                </p>


                            </div>

                        `;

                    });


            }


            catch (error) {


                console.error(
                    "❌ Dashboard error:",
                    error
                );


                // ==========================================
                // SERVER OFFLINE
                // ==========================================


                serverStatus.textContent =
                    "🔴 Cannot connect to restaurant server";


                serverStatus.className =
                    "server-status server-offline";


                // ==========================================
                // SHOW ERROR
                // ==========================================


                document.getElementById(
                    "orders"
                ).innerHTML = `

                    <div class="error-message">

                        ❌ Cannot connect
                        to restaurant server

                        <br><br>

                        Please check the Render server.

                    </div>

                `;

            }


        }



        // ==================================================
        // FIRST LOAD
        // ==================================================


        loadDashboard();



        // ==================================================
        // AUTO REFRESH
        // ==================================================


        setInterval(

            loadDashboard,

            5000

        );


    </script>


</body>

</html>
