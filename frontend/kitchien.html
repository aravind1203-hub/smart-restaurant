<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QResto - Kitchen Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .container > h2 {
            text-align: center;
            color: #6b1e1e;
            margin-bottom: 25px;
        }

        .orders {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 25px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .order-card h2 {
            margin-top: 0;
            color: #6b1e1e;
        }

        .order-card ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        .status {
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #b77d00;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .no-orders {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 30px;
        }

        .server-info {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #777;
        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header>

        <h1>👨‍🍳 QResto Kitchen Dashboard</h1>

        <p>Manage Customer Orders</p>

    </header>


    <!-- ==========================================
         MAIN CONTAINER
    ========================================== -->

    <div class="container">

        <h2>
            🆕 New Orders
        </h2>


        <div
            class="orders"
            id="orders"
        >

            <div class="no-orders">
                Loading orders...
            </div>

        </div>


        <div
            class="server-info"
            id="server-info"
        ></div>

    </div>


    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        // ==========================================
        // SERVER URL
        // ==========================================

        /*
            Local:
            http://localhost:3000

            Render:
            https://smart-restaurant-3axh.onrender.com

            Same server frontend + backend என்பதால்
            window.location.origin use செய்கிறோம்.
        */

        const SERVER_URL =
            "https://smart-restaurant-3axh.onrender.com";


        console.log(
            "🌐 SERVER URL:",
            SERVER_URL
        );


        // Show server URL

        document.getElementById(
            "server-info"
        ).textContent =
            `Server: ${SERVER_URL}`;


        // ==========================================
        // LOAD ORDERS
        // ==========================================

        async function loadOrders() {

            const ordersContainer =
                document.getElementById(
                    "orders"
                );


            try {

                console.log(
                    "📡 Loading orders..."
                );


                const response =
                    await fetch(
                        `${SERVER_URL}/api/orders`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json"
                            },

                            cache: "no-store"
                        }
                    );


                console.log(
                    "📥 Orders response:",
                    response.status
                );


                // ==========================================
                // SERVER ERROR
                // ==========================================

                if (!response.ok) {

                    throw new Error(
                        `Server error: ${response.status}`
                    );

                }


                // ==========================================
                // READ JSON
                // ==========================================

                const data =
                    await response.json();


                console.log(
                    "📦 Orders data:",
                    data
                );


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Could not load orders"
                    );

                }


                ordersContainer.innerHTML = "";


                // ==========================================
                // GET ORDERS
                // ==========================================

                const allOrders =
                    Array.isArray(data.orders)
                        ? data.orders
                        : [];


                // ==========================================
                // FILTER KITCHEN ORDERS
                // ==========================================

                const kitchenOrders =
                    allOrders.filter(order =>

                        order.status === "Pending" ||

                        order.status === "Preparing"

                    );


                // ==========================================
                // NO ORDERS
                // ==========================================

                if (
                    kitchenOrders.length === 0
                ) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders">

                            🍽️ No new orders

                        </div>

                    `;

                    return;

                }


                // ==========================================
                // DISPLAY ORDERS
                // ==========================================

                kitchenOrders.forEach(order => {


                    // ==========================================
                    // ITEMS
                    // ==========================================

                    let items = [];


                    try {

                        if (
                            typeof order.items ===
                            "string"
                        ) {

                            items =
                                JSON.parse(
                                    order.items
                                );

                        }

                        else if (
                            Array.isArray(
                                order.items
                            )
                        ) {

                            items =
                                order.items;

                        }

                    }

                    catch (error) {

                        console.error(
                            "❌ Items JSON error:",
                            error
                        );

                        items = [];

                    }


                    // ==========================================
                    // ITEMS HTML
                    // ==========================================

                    let itemsHTML = "";


                    items.forEach(item => {

                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        itemsHTML += `

                            <li>

                                ${item.name}

                                × ${quantity}

                            </li>

                        `;

                    });


                    // ==========================================
                    // STATUS
                    // ==========================================

                    const status =
                        order.status ||
                        "Pending";


                    // ==========================================
                    // BUTTON
                    // ==========================================

                    let buttonHTML = "";


                    if (
                        status === "Pending"
                    ) {

                        buttonHTML = `

                            <button
                                onclick="
                                    startPreparing(
                                        ${order.id}
                                    )
                                "
                            >

                                👨‍🍳 Start Preparing

                            </button>

                        `;

                    }


                    else if (
                        status === "Preparing"
                    ) {

                        buttonHTML = `

                            <button
                                onclick="
                                    markReady(
                                        ${order.id}
                                    )
                                "
                            >

                                ✅ Mark as Ready

                            </button>

                        `;

                    }


                    // ==========================================
                    // ORDER CARD
                    // ==========================================

                    ordersContainer.innerHTML += `

                        <div class="order-card">

                            <h2>

                                🧾 Order #${order.id}

                            </h2>


                            <p>

                                🪑 Table:

                                <strong>

                                    ${order.table_number}

                                </strong>

                            </p>


                            <h3>

                                🍛 Items

                            </h3>


                            <ul>

                                ${itemsHTML}

                            </ul>


                            <p>

                                <strong>

                                    💰 Total:
                                    ₹${Number(
                                        order.total
                                    ).toFixed(2)}

                                </strong>

                            </p>


                            <p class="status">

                                📌 Status:
                                ${status}

                            </p>


                            ${buttonHTML}

                        </div>

                    `;

                });


            }


            catch (error) {

                console.error(
                    "❌ Cannot load orders:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="no-orders">

                        ❌ Cannot connect to restaurant server

                        <br><br>

                        <small>

                            ${error.message}

                        </small>

                    </div>

                `;

            }

        }


        // ==========================================
        // UPDATE ORDER STATUS
        // ==========================================

        async function updateOrderStatus(
            orderId,
            status
        ) {

            try {

                console.log(
                    `📡 Updating Order ${orderId} → ${status}`
                );


                const response =
                    await fetch(

                        `${SERVER_URL}/api/orders/${orderId}/status`,

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    status:
                                        status

                                })

                        }

                    );


                console.log(
                    "📥 Status response:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "📦 Status data:",
                    data
                );


                if (!response.ok) {

                    throw new Error(

                        data.message ||

                        `Server error: ${response.status}`

                    );

                }


                if (
                    data.success
                ) {

                    return true;

                }


                throw new Error(

                    data.message ||

                    "Could not update order"

                );

            }


            catch (error) {

                console.error(
                    "❌ Status update error:",
                    error
                );


                alert(

                    "❌ Could not connect to restaurant server!\n\n" +

                    error.message

                );


                return false;

            }

        }


        // ==========================================
        // PENDING → PREPARING
        // ==========================================

        async function startPreparing(
            orderId
        ) {

            const confirmed =
                confirm(

                    `👨‍🍳 Start preparing Order #${orderId}?`

                );


            if (!confirmed) {

                return;

            }


            const success =
                await updateOrderStatus(

                    orderId,

                    "Preparing"

                );


            if (success) {

                alert(

                    `👨‍🍳 Order #${orderId} is now Preparing!`

                );


                loadOrders();

            }

        }


        // ==========================================
        // PREPARING → READY
        // ==========================================

        async function markReady(
            orderId
        ) {

            const confirmed =
                confirm(

                    `✅ Mark Order #${orderId} as Ready?`

                );


            if (!confirmed) {

                return;

            }


            const success =
                await updateOrderStatus(

                    orderId,

                    "Ready"

                );


            if (success) {

                alert(

                    `✅ Order #${orderId} is Ready!`

                );


                loadOrders();

            }

        }


        // ==========================================
        // FIRST LOAD
        // ==========================================

        loadOrders();


        // ==========================================
        // AUTO REFRESH
        // ==========================================

        setInterval(

            loadOrders,

            5000

        );


    </script>


</body>

</html>
