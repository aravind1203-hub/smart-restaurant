<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QResto - Billing Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .container > h2 {
            text-align: center;
            color: #6b1e1e;
            margin-bottom: 25px;
        }

        .orders {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 25px;
        }

        .bill-card {
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .bill-card h2 {
            margin-top: 0;
            color: #6b1e1e;
        }

        .bill-card ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .payment {
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #b77d00;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .no-orders {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 30px;
        }

    </style>

</head>


<body>

    <header>

        <h1>💰 QResto Billing Dashboard</h1>

        <p>Manage Customer Payments</p>

    </header>


    <div class="container">

        <h2>🧾 Orders & Billing</h2>

        <div class="orders" id="orders"></div>

    </div>


    <script>

        // ==========================================
        // LOAD ORDERS
        // ==========================================

        async function loadOrders() {

            try {

                const response = await fetch(
                    "http://localhost:3000/api/orders"
                );

                if (!response.ok) {

                    throw new Error(
                        "Server response error"
                    );

                }

                const data = await response.json();

                const ordersContainer =
                    document.getElementById("orders");

                ordersContainer.innerHTML = "";


                if (
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    ordersContainer.innerHTML = `
                        <div class="no-orders">
                            🧾 No orders found
                        </div>
                    `;

                    return;
                }


                // Show orders

                data.orders.forEach(order => {

                    let items = [];


                    try {

                        items =
                            typeof order.items === "string"
                                ? JSON.parse(order.items)
                                : order.items;

                    } catch (error) {

                        console.error(
                            "Items error:",
                            error
                        );

                    }


                    let itemsHTML = "";


                    items.forEach(item => {

                        itemsHTML += `
                            <li>
                                ${item.name}
                                × ${item.quantity}
                                - ₹${item.price}
                            </li>
                        `;

                    });


                    const paymentStatus =
                        order.payment_status || "Pending";


                    let paymentButton = "";


                    if (
                        paymentStatus === "Pending"
                    ) {

                        paymentButton = `
                            <button
                                onclick="markPaid(${order.id})"
                            >
                                💳 Mark as Paid
                            </button>
                        `;

                    } else {

                        paymentButton = `
                            <button disabled>
                                ✅ Payment Completed
                            </button>
                        `;

                    }


                    ordersContainer.innerHTML += `

                        <div class="bill-card">

                            <h2>
                                🧾 Order #${order.id}
                            </h2>

                            <p>
                                🪑 Table:
                                <strong>
                                    ${order.table_number}
                                </strong>
                            </p>

                            <ul>
                                ${itemsHTML}
                            </ul>

                            <p class="total">
                                Total:
                                ₹${order.total}
                            </p>

                            <p class="payment">
                                Payment:
                                ${paymentStatus}
                            </p>

                            ${paymentButton}

                        </div>

                    `;

                });

            }

            catch (error) {

                console.error(
                    "❌ Cannot load billing:",
                    error
                );

                document.getElementById(
                    "orders"
                ).innerHTML = `

                    <div class="no-orders">

                        ❌ Cannot connect
                        to restaurant server

                    </div>

                `;

            }

        }


        // ==========================================
        // MARK PAYMENT AS PAID
        // ==========================================

        async function markPaid(orderId) {

            try {

                const response = await fetch(

                    `http://localhost:3000/api/orders/${orderId}/payment`,

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            payment_status: "Paid"

                        })

                    }

                );


                const data =
                    await response.json();


                if (data.success) {

                    alert(
                        "✅ Payment marked as Paid!"
                    );

                    loadOrders();

                } else {

                    alert(
                        "❌ Payment update failed!"
                    );

                }

            }

            catch (error) {

                console.error(
                    "❌ Payment error:",
                    error
                );

                alert(
                    "❌ Cannot connect to server!"
                );

            }

        }


        // Load when page opens

        loadOrders();


        // Auto refresh

        setInterval(
            loadOrders,
            5000
        );

    </script>

</body>

</html>
