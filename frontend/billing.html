<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QResto - Billing Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .container > h2 {
            text-align: center;
            color: #6b1e1e;
            margin-bottom: 25px;
        }

        .orders {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .bill-card {
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .bill-card h2 {
            margin-top: 0;
            color: #6b1e1e;
        }

        .bill-card ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .payment {
            font-weight: bold;
            margin: 15px 0;
        }

        .pending {
            color: #d89b00;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #b77d00;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .no-orders {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 30px;

            grid-column: 1 / -1;
        }

        .error {
            color: #b00000;
        }

        .refresh-info {
            text-align: center;
            color: #777;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .order-status {
            padding: 8px 12px;
            border-radius: 8px;

            background: #f6f1e8;

            display: inline-block;

            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
            }

            .bill-card {
                padding: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header>

        <h1>
            💰 QResto Billing Dashboard
        </h1>

        <p>
            Manage Customer Payments
        </p>

    </header>


    <!-- ==========================================
         MAIN
    ========================================== -->

    <div class="container">

        <h2>
            🧾 Pending Bills
        </h2>

        <div class="refresh-info">

            🔄 Automatically refreshing every 5 seconds

        </div>

        <div
            class="orders"
            id="orders"
        >

            <div class="no-orders">

                ⏳ Loading bills...

            </div>

        </div>

    </div>


    <script>


        // ==================================================
        // SERVER URL
        // ==================================================

        const SERVER_URL =
            window.location.origin;


        console.log(
            "🌐 Billing Server:",
            SERVER_URL
        );


        // ==================================================
        // LOAD ONLY PENDING PAYMENTS
        // ==================================================

        async function loadOrders() {


            const ordersContainer =
                document.getElementById("orders");


            try {


                console.log(
                    "📡 Loading pending payments..."
                );


                /*
                    IMPORTANT:

                    We use:

                    /api/payments/pending

                    Instead of:

                    /api/orders

                    So Paid bills will NOT appear here.
                */


                const response =
                    await fetch(

                        `${SERVER_URL}/api/payments/pending`,

                        {
                            method: "GET",
                            cache: "no-store"
                        }

                    );


                console.log(
                    "📥 Pending payments response:",
                    response.status
                );


                if (!response.ok) {

                    throw new Error(
                        `Server error: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "📦 Pending payment data:",
                    data
                );


                ordersContainer.innerHTML = "";


                // ==================================================
                // NO PENDING BILLS
                // ==================================================

                if (
                    !data.success ||
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders">

                            ✅ No pending bills

                            <br><br>

                            All payments are completed.

                        </div>

                    `;

                    return;

                }


                // ==================================================
                // DISPLAY ONLY PENDING BILLS
                // ==================================================

                data.orders.forEach(order => {


                    let items = [];


                    // ==================================================
                    // CONVERT ITEMS JSON
                    // ==================================================

                    try {

                        if (
                            typeof order.items ===
                            "string"
                        ) {

                            items =
                                JSON.parse(
                                    order.items
                                );

                        }

                        else {

                            items =
                                order.items || [];

                        }

                    }

                    catch (error) {

                        console.error(
                            "❌ Items JSON error:",
                            error
                        );

                        items = [];

                    }


                    // ==================================================
                    // ITEMS HTML
                    // ==================================================

                    let itemsHTML = "";


                    items.forEach(item => {


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const itemTotal =
                            price * quantity;


                        itemsHTML += `

                            <li>

                                <strong>
                                    ${item.name}
                                </strong>

                                × ${quantity}

                                -

                                ₹${itemTotal.toFixed(2)}

                            </li>

                        `;

                    });


                    // ==================================================
                    // CREATE BILL CARD
                    // ==================================================

                    ordersContainer.innerHTML += `

                        <div class="bill-card">


                            <h2>

                                🧾 Order #${order.id}

                            </h2>


                            <p>

                                🪑 Table:

                                <strong>

                                    ${order.table_number}

                                </strong>

                            </p>


                            <p>

                                🍳 Order Status:

                                <span class="order-status">

                                    ${order.status || "Pending"}

                                </span>

                            </p>


                            <h3>

                                🍛 Ordered Items

                            </h3>


                            <ul>

                                ${
                                    itemsHTML ||
                                    "<li>No items found</li>"
                                }

                            </ul>


                            <p class="total">

                                💰 Total:

                                ₹${Number(
                                    order.total || 0
                                ).toFixed(2)}

                            </p>


                            <p class="payment pending">

                                💰 Payment:

                                <strong>

                                    🟡 Pending

                                </strong>

                            </p>


                            <button
                                onclick="markPaid(${order.id})"
                            >

                                💳 Mark as Paid

                            </button>


                        </div>

                    `;

                });


            }


            catch (error) {


                console.error(
                    "❌ Cannot load billing:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="no-orders error">

                        ❌ Cannot connect to restaurant server

                        <br><br>

                        Please check the Render server.

                        <br><br>

                        <small>

                            ${error.message}

                        </small>

                    </div>

                `;

            }

        }


        // ==================================================
        // MARK PAYMENT AS PAID
        // ==================================================

        async function markPaid(orderId) {


            const confirmPayment =
                confirm(

                    `💰 Confirm payment received?\n\n` +

                    `🧾 Order: #${orderId}\n\n` +

                    `Click OK to mark as Paid.`

                );


            if (!confirmPayment) {

                return;

            }


            try {


                console.log(
                    `💳 Processing payment for Order #${orderId}`
                );


                // ==================================================
                // PAYMENT API
                // ==================================================

                const response =
                    await fetch(

                        `${SERVER_URL}/api/payments/${orderId}`,

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            }

                        }

                    );


                console.log(
                    "📥 Payment response:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "💰 Payment data:",
                    data
                );


                // ==================================================
                // SUCCESS
                // ==================================================

                if (
                    response.ok &&
                    data.success
                ) {


                    alert(

                        `✅ Payment received successfully!\n\n` +

                        `🧾 Order: #${orderId}\n` +

                        `🪑 Table: ${data.table || ""}\n\n` +

                        `🟢 Table is now Available.`

                    );


                    /*
                        IMPORTANT:

                        Reload pending payments.

                        Since payment_status is now Paid,
                        this order will disappear
                        automatically from Billing Dashboard.
                    */

                    loadOrders();


                }


                // ==================================================
                // ERROR
                // ==================================================

                else {


                    alert(

                        "❌ Payment update failed!\n\n" +

                        (
                            data.message ||
                            "Unknown server error"
                        )

                    );

                }


            }


            catch (error) {


                console.error(
                    "❌ Payment error:",
                    error
                );


                alert(

                    "❌ Cannot connect to restaurant server!\n\n" +

                    error.message

                );

            }

        }


        // ==================================================
        // FIRST LOAD
        // ==================================================

        loadOrders();


        // ==================================================
        // AUTO REFRESH
        // ==================================================

        setInterval(

            loadOrders,

            5000

        );


    </script>


</body>

</html>
