<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QResto - Order History</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f1e8;
        }

        header {
            background: #6b1e1e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 7px 0 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .container > h2 {
            text-align: center;
            color: #6b1e1e;
            margin-bottom: 25px;
        }

        .orders {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .order-card h2 {
            margin-top: 0;
            color: #6b1e1e;
        }

        .order-card ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #6b1e1e;
        }

        .status {
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            background: #faf7f1;
        }

        .payment {
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            background: #faf7f1;
        }

        .no-orders {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 30px;
        }

        .error {
            color: #b00000;
        }

        .refresh-btn {
            display: block;
            width: 220px;
            margin: 0 auto 25px auto;

            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #d89b00;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #b77d00;
        }

        .order-date {
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
            }

            .orders {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <h1>📋 QResto Order History</h1>

        <p>View Previous Restaurant Orders</p>

    </header>


    <!-- ==========================================
         MAIN CONTAINER
    =========================================== -->

    <div class="container">

        <h2>
            🧾 All Orders
        </h2>


        <!-- REFRESH BUTTON -->

        <button
            class="refresh-btn"
            onclick="loadOrderHistory()"
        >

            🔄 Refresh Orders

        </button>


        <!-- ORDERS -->

        <div
            class="orders"
            id="orders"
        >

            <div class="no-orders">

                ⏳ Loading orders...

            </div>

        </div>

    </div>


    <script>


        // ==========================================
        // SERVER URL
        // ==========================================

        // Local:
        // http://localhost:3000
        //
        // Render:
        // https://smart-restaurant-3axh.onrender.com
        //
        // Automatically detects current server.

        const SERVER_URL =
            window.location.origin;


        console.log(
            "🌐 Server URL:",
            SERVER_URL
        );


        // ==========================================
        // LOAD ORDER HISTORY
        // ==========================================

        async function loadOrderHistory() {

            const ordersContainer =
                document.getElementById("orders");


            // Loading message

            ordersContainer.innerHTML = `

                <div class="no-orders">

                    ⏳ Loading orders...

                </div>

            `;


            try {


                console.log(
                    "📡 Requesting orders from:",
                    `${SERVER_URL}/api/orders`
                );


                // ==========================================
                // GET ORDERS
                // ==========================================

                const response =
                    await fetch(

                        `${SERVER_URL}/api/orders`,

                        {

                            method: "GET",

                            headers: {

                                "Accept":
                                    "application/json"

                            }

                        }

                    );


                console.log(
                    "📥 Server status:",
                    response.status
                );


                // ==========================================
                // SERVER ERROR
                // ==========================================

                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }


                // ==========================================
                // READ RESPONSE
                // ==========================================

                const data =
                    await response.json();


                console.log(
                    "📦 Orders received:",
                    data
                );


                // ==========================================
                // CLEAR CONTAINER
                // ==========================================

                ordersContainer.innerHTML = "";


                // ==========================================
                // CHECK SUCCESS
                // ==========================================

                if (!data.success) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders error">

                            ❌ ${

                                data.message ||

                                "Could not load orders"

                            }

                        </div>

                    `;

                    return;

                }


                // ==========================================
                // NO ORDERS
                // ==========================================

                if (
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    ordersContainer.innerHTML = `

                        <div class="no-orders">

                            📋 No orders found

                        </div>

                    `;

                    return;

                }


                // ==========================================
                // DISPLAY ORDERS
                // ==========================================

                data.orders.forEach(order => {


                    // ==========================================
                    // ITEMS
                    // ==========================================

                    let items = [];


                    try {

                        if (
                            typeof order.items ===
                            "string"
                        ) {

                            items =
                                JSON.parse(
                                    order.items
                                );

                        }

                        else {

                            items =
                                order.items || [];

                        }

                    }

                    catch (error) {

                        console.error(
                            "❌ Items JSON error:",
                            error
                        );

                        items = [];

                    }


                    // ==========================================
                    // ITEMS HTML
                    // ==========================================

                    let itemsHTML = "";


                    items.forEach(item => {


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const itemTotal =
                            price * quantity;


                        itemsHTML += `

                            <li>

                                <strong>
                                    ${item.name}
                                </strong>

                                × ${quantity}

                                -

                                ₹${itemTotal.toFixed(2)}

                            </li>

                        `;

                    });


                    // ==========================================
                    // STATUS
                    // ==========================================

                    const status =
                        order.status ||
                        "Pending";


                    // ==========================================
                    // PAYMENT STATUS
                    // ==========================================

                    const paymentStatus =
                        order.payment_status ||
                        "Pending";


                    // ==========================================
                    // TOTAL
                    // ==========================================

                    const total =
                        Number(order.total) || 0;


                    // ==========================================
                    // CREATED DATE
                    // ==========================================

                    let createdDate = "";


                    if (order.created_at) {

                        try {

                            createdDate =
                                new Date(
                                    order.created_at
                                ).toLocaleString();

                        }

                        catch (error) {

                            createdDate =
                                order.created_at;

                        }

                    }


                    // ==========================================
                    // CREATE ORDER CARD
                    // ==========================================

                    ordersContainer.innerHTML += `

                        <div class="order-card">


                            <h2>

                                🧾 Order #${order.id}

                            </h2>


                            <p>

                                🪑 Table:

                                <strong>

                                    ${order.table_number}

                                </strong>

                            </p>


                            ${
                                createdDate

                                ? `

                                    <p class="order-date">

                                        📅 ${createdDate}

                                    </p>

                                `

                                : ""

                            }


                            <h3>

                                🍛 Ordered Items

                            </h3>


                            <ul>

                                ${
                                    itemsHTML ||

                                    "<li>No items found</li>"
                                }

                            </ul>


                            <p class="total">

                                💰 Total:

                                ₹${total.toFixed(2)}

                            </p>


                            <p class="status">

                                📌 Order Status:

                                <strong>

                                    ${status}

                                </strong>

                            </p>


                            <p class="payment">

                                💵 Payment:

                                <strong>

                                    ${paymentStatus}

                                </strong>

                            </p>


                        </div>

                    `;

                });


            }


            // ==========================================
            // CONNECTION ERROR
            // ==========================================

            catch (error) {


                console.error(
                    "❌ Cannot load order history:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="no-orders error">

                        ❌ Cannot connect to restaurant server

                        <br><br>

                        <small>

                            Server:
                            ${SERVER_URL}

                        </small>

                        <br><br>

                        <button
                            class="refresh-btn"
                            onclick="loadOrderHistory()"
                        >

                            🔄 Try Again

                        </button>

                    </div>

                `;

            }

        }


        // ==========================================
        // FIRST LOAD
        // ==========================================

        loadOrderHistory();


        // ==========================================
        // AUTO REFRESH
        // ==========================================

        setInterval(

            loadOrderHistory,

            5000

        );


    </script>


</body>

</html>
